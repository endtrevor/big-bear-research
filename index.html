<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Bear Research is now Vegas Peps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f2ea; --surface:#fcfaf4; --ink:#1a1a17; --muted:#56524a; --faint:#8c8678;
    --line:#ddd6c8; --line2:#c9c1af;
    --red:#ba331c; --red-bright:#db3c21; --gold:#c2982f; --gold-bright:#dcc833; --blue:#2b5483;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px; text-align:center;
    overflow-x:hidden;
  }
  .wrap{max-width:560px; width:100%}

  /* Logo */
  .logo{
    width:min(420px,86vw); height:auto; display:block; margin:0 auto 8px;
    opacity:0; transform:translateY(12px) scale(.96);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s forwards;
  }

  /* Eyebrow */
  .moved{
    font-size:clamp(44px,12vw,88px); font-weight:800; letter-spacing:-.035em;
    line-height:.95; color:var(--ink); margin:0 0 26px;
    opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s forwards;
  }

  /* Marquee bulb divider */
  .bulbs{
    display:flex; gap:11px; justify-content:center; align-items:center;
    margin:0 0 26px;
    opacity:0; animation:rise .8s ease .3s forwards;
  }
  .bulbs span{
    width:8px; height:8px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 0 1.5px rgba(26,26,23,.18);
    animation:twinkle 2.4s ease-in-out infinite;
  }
  .bulbs span:nth-child(odd){background:var(--red)}
  .bulbs span:nth-child(2){animation-delay:.3s}
  .bulbs span:nth-child(3){animation-delay:.6s}
  .bulbs span:nth-child(4){animation-delay:.9s;background:var(--blue)}
  .bulbs span:nth-child(5){animation-delay:1.2s}
  .bulbs span:nth-child(6){animation-delay:1.5s}
  .bulbs span:nth-child(7){animation-delay:1.8s;background:var(--blue)}

  /* Domain transformation */
  .retired-label{
    font-family:'Spline Sans Mono',monospace; font-size:11px; font-weight:500;
    letter-spacing:.28em; text-transform:uppercase; color:var(--faint);
    margin-bottom:8px; opacity:0; animation:rise .8s ease .42s forwards;
  }
  .old-brand{
    font-size:clamp(24px,6.5vw,34px); font-weight:700; letter-spacing:-.01em;
    color:var(--faint); position:relative; display:inline-block; margin-bottom:16px;
    opacity:0; animation:rise .8s ease .48s forwards;
  }
  .old-brand::after{
    content:""; position:absolute; left:-6px; right:-6px; top:52%; height:3px;
    background:var(--red); transform:scaleX(0); transform-origin:left;
    animation:strike .55s cubic-bezier(.6,0,.3,1) 1.0s forwards;
  }
  .old-domain::after{
    content:""; position:absolute; left:-4px; right:-4px; top:52%; height:2px;
    background:var(--red); transform:scaleX(0); transform-origin:left;
    animation:strike .5s cubic-bezier(.6,0,.3,1) 1.05s forwards;
  }
  .isnow{
    font-family:'Spline Sans Mono',monospace; font-size:26px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--gold);
    margin:14px 0 18px; line-height:1;
    opacity:0; animation:rise .7s ease .6s forwards;
  }
  .new-brand{
    font-size:clamp(40px,11vw,64px); letter-spacing:-.02em; line-height:1.0;
    margin-bottom:4px; color:var(--ink);
    opacity:0; animation:rise .85s cubic-bezier(.2,.7,.2,1) .72s forwards;
  }
  .new-brand .nb-v{font-weight:500}
  .new-brand .nb-p{font-weight:800;color:var(--red)}
  .new-domain{
    font-family:'Spline Sans Mono',monospace; font-size:clamp(14px,3.6vw,17px);
    font-weight:500; letter-spacing:.04em; color:var(--muted); margin-bottom:20px;
    opacity:0; animation:rise .8s ease .82s forwards;
  }
  .new-domain b{color:var(--red)}

  .lede{
    font-size:clamp(15px,3.6vw,17px); color:var(--muted); max-width:420px;
    margin:0 auto 34px;
    opacity:0; animation:rise .8s ease .9s forwards;
  }

  /* CTA */
  .cta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--ink); color:var(--bg); text-decoration:none;
    font-family:'Archivo Narrow',sans-serif; font-weight:700;
    font-size:16px; letter-spacing:.1em; text-transform:uppercase;
    padding:18px 38px; border:none; cursor:pointer;
    transition:background .22s ease, transform .22s ease, letter-spacing .22s ease, box-shadow .22s ease;
    opacity:0; animation:rise .8s ease 1.05s forwards, pulse 2.4s ease-in-out 2.0s infinite;
  }
  
  .cta:hover{background:var(--red); transform:translateY(-2px); letter-spacing:.13em; animation-play-state:paused; box-shadow:0 8px 30px 2px rgba(161,77,42,0.35)}
  .cta:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
  .cta svg{width:17px;height:17px;transition:transform .22s ease}
  .cta:hover svg{transform:translateX(4px)}

  /* Password note */
  .note{
    margin-top:30px;
    display:inline-flex; align-items:center; gap:9px;
    font-size:13.5px; color:var(--muted);
    background:var(--surface); border:1.5px solid var(--line);
    padding:11px 18px; border-radius:2px;
    opacity:0; animation:rise .8s ease 1.2s forwards;
  }
  .note svg{width:15px;height:15px;flex-shrink:0;color:var(--gold)}
  .note b{color:var(--ink);font-weight:700}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(161,77,42,0)}
    50%{box-shadow:0 6px 26px 2px rgba(161,77,42,0.28)}
  }
  @keyframes strike{to{transform:scaleX(1)}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .logo,.eyebrow,.bulbs,.old-domain,.arrow,.new-domain,.lede,.cta,.note{opacity:1!important;transform:none!important}
    .old-domain::after{transform:scaleX(1)}
  }
</style>
</head>
